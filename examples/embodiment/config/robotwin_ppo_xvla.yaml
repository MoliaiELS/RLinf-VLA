# Single-GPU integration run; collect fresh validation evidence before scaling.
defaults:
  - model/xvla@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  max_epochs: 1
  max_steps: 1
  only_eval: false
  val_check_interval: 1
  save_interval: 1
  resume_dir: null
  ckpt_path: null
  logger:
    log_path: ${oc.env:XVLA_RUN_DIR}
    project_name: rlinf-xvla
    experiment_name: robotwin_ppo_xvla
    logger_backends: [tensorboard]

algorithm:
  adv_type: gae
  loss_type: actor_critic
  group_size: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  loss_agg_func: token-mean
  update_epoch: 1
  normalize_advantages: true
  reward_coef: 1.0
  gamma: 0.99 # Discount per 30-anchor macro-step.
  gae_lambda: 0.95
  kl_penalty: kl
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  filter_rewards: false
  rewards_lower_bound: 0.01
  rewards_upper_bound: 0.99

env:
  group_name: EnvGroup
  enable_offload: false
  train:
    env_type: robotwin
    xvla_native: true
    robotwin_root: ${oc.env:ROBOTWIN_PATH}
    task_name: move_stapler_pad
    condition: easy
    total_num_envs: 2
    group_size: 1
    rollout_epoch: 1
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 300
    auto_reset: false
    ignore_terminations: false
    seed: 1234
    reset_seeds: [12000, 12001, 12002, 12003]
    use_fixed_reset_state_ids: false
    is_eval: false
    reward_coef: 1.0
    video_cfg:
      save_video: false
  eval:
    env_type: robotwin
    xvla_native: true
    robotwin_root: ${oc.env:ROBOTWIN_PATH}
    task_name: move_stapler_pad
    condition: easy
    total_num_envs: 2
    group_size: 1
    rollout_epoch: 1
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 300
    auto_reset: false
    ignore_terminations: false
    seed: 2234
    reset_seeds: [13000, 13001, 13002, 13003]
    use_fixed_reset_state_ids: true
    is_eval: true
    reward_coef: 1.0
    video_cfg:
      save_video: false

rollout:
  group_name: RolloutGroup
  rollout_backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  enable_cuda_graph: false
  collect_prev_infos: true
  collect_final_values: true
  model: ${actor.model}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 20
  seed: 1234
  enable_offload: false
  optim:
    lr: 1.0e-6
    value_lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.0
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    disable: true # Keep one root FSDP unit when the VLM is frozen.
    use_orig_params: true
    cpu_offload: false
    gradient_checkpointing: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: fp32
      reduce_dtype: fp32
      buffer_dtype: fp32
    amp_autocast:
      enabled: false

reward:
  use_reward_model: false
critic:
  use_critic_model: false
