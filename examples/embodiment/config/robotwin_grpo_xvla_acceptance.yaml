# Allow six collection rounds; tied groups do not count toward three updates.
defaults:
  - robotwin_grpo_xvla
  - _self_

runner:
  max_epochs: 6
  max_steps: 6
  val_check_interval: 3
  save_interval: 3
  logger:
    experiment_name: robotwin_grpo_xvla_acceptance

acceptance:
  min_updates: 3

env:
  train:
    reset_seed_mode: cycle

actor:
  fsdp_config:
    save_full_model_weights: false
